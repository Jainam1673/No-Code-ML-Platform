apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nocodeml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7
          args: ["--appendonly", "yes", "--save", "60", "1000"]
          ports:
            - containerPort: 6379
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            failureThreshold: 20
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nocodeml
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

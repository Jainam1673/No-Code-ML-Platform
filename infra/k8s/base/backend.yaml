apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-artifacts-pvc
  namespace: nocodeml
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nocodeml
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: backend
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: ghcr.io/your-org/nocodeml-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nocodeml-config
          env:
            - name: NOCODEML_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nocodeml-secrets
                  key: NOCODEML_DATABASE_URL
            - name: NOCODEML_REDIS_URL
              value: redis://redis:6379/0
            - name: NOCODEML_CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: NOCODEML_CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
          volumeMounts:
            - name: backend-artifacts
              mountPath: /app/artifacts
          startupProbe:
            httpGet:
              path: /livez
              port: 8000
            failureThreshold: 20
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: backend-artifacts
          persistentVolumeClaim:
            claimName: backend-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nocodeml
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: nocodeml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: nocodeml
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: nocodeml
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: worker
      containers:
        - name: worker
          image: ghcr.io/your-org/nocodeml-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "main.py", "worker"]
          envFrom:
            - configMapRef:
                name: nocodeml-config
          env:
            - name: NOCODEML_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nocodeml-secrets
                  key: NOCODEML_DATABASE_URL
            - name: NOCODEML_REDIS_URL
              value: redis://redis:6379/0
            - name: NOCODEML_CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: NOCODEML_CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: NOCODEML_EXECUTION_BACKEND
              value: celery
          volumeMounts:
            - name: backend-artifacts
              mountPath: /app/artifacts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: backend-artifacts
          persistentVolumeClaim:
            claimName: backend-artifacts-pvc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: nocodeml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: nocodeml
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker

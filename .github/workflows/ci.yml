name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync
      - name: Backend lint
        run: uv run ruff check app tests main.py
      - name: Backend tests
        run: uv run pytest
      - name: Backend check command
        run: uv run python main.py check
      - name: Backend DB migration command
        run: uv run python main.py db-upgrade

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Validate base kustomize rendering
        run: kubectl kustomize infra/k8s/base > /tmp/base.yaml
      - name: Validate gpu overlay rendering
        run: kubectl kustomize infra/k8s/overlays/gpu-worker > /tmp/gpu.yaml

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -t nocodeml-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t nocodeml-frontend:ci ./frontend
